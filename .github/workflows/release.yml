name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - run: sudo apt-get install -y zsh
      - uses: oven-sh/setup-bun@v2
        with:
          registry-url: https://registry.npmjs.org
      - name: dogfood (lintmax check on itself) + build
        run: bun action
      - name: publish lintmax to npm
        working-directory: packages/lintmax
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: bun publish --access public
      - name: create github release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --title "${GITHUB_REF_NAME}" --generate-notes
      - name: prune to single latest release (single-present-release discipline)
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/prune-old-releases.sh
